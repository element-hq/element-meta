name: Enhancement request
description: Suggest a new feature or a change to an existing one, for any Element app.
labels: [T-Enhancement, "App: web", "App: ElementX Android", "App: ElementX iOS"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to propose an enhancement or a new feature for the Element
        apps.

        **All feature requests for the Element apps live here**, even if only one platform is
        concerned: Web/Desktop, Android or iOS. The app repositories hold bugs and engineering tasks
        only.

        Your request will be triaged by the Element product team. See
        [how feature requests are triaged](https://github.com/element-hq/element-meta/blob/develop/docs/process/feature-requests.md)
        for what the answer means.

        Please report security issues by email to security@element.io — not here.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Before you start
      options:
        - label: I have searched [element-meta](https://github.com/element-hq/element-meta/issues) and the app repositories and found no duplicate.
          required: true
  - type: textarea
    id: usecase
    attributes:
      label: Your use case
      description: Start with the problem rather than the solution — it is what we decide on. Screenshots or mock ups are welcome.
      value: |
        #### What problem are you trying to solve?

        #### Who has this problem, and how often? (just you, your team or organisation, your community, most users…)

        #### What would you like to happen instead?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Have you considered any alternatives?
      placeholder: How do you work around it today? Any other solution you've considered?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      placeholder: Is there anything else you'd like to add?
    validations:
      required: false
  - type: checkboxes
    id: pr
    attributes:
      label: Are you willing to provide a PR?
      description: |
        Tick each app you could write the PR for. Don't worry, it's still OK to leave them all
        unticked :). PRs go to the app repositories, so a request can need several of them.
        Please wait for the issue to get an `X-Accepting-PRs` or `X-Accepting-PoC-PRs` label
        before writing code. Both mean we will review a PR — the first is a commitment to help get
        it integrated, the second means we will evaluate it as a proof of concept, with no promise
        to merge.
      options:
        - label: Web / Desktop
        - label: Android
        - label: iOS
